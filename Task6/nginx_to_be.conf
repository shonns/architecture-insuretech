http
{

	# Настройка зоны для ограничения запросов - 10 request/min
	# $binary_remote_addr: Ключ ограничения (IP-адрес клиента)
	# zone=rate_limit_zone: Имя зоны
	# 10m: Выделенная память (10 МБ, хранит ~160 000 состояний)
	# rate=10r/m: 10 запросов в минуту

	limit_req_zone $binary_remote_addr zone=rate_limit:10m rate=10r/m;

	# Настройка upstream для балансировки нагрузки
	upstream backend_servers
	{

		server backend1.example.com;
		server backend2.example.com;
		server backend3.example.com;
	}

	server
	{

		listen 80;

		location /
		{

			# Ограничения запросов
			# burst=0: Запрещает накопление запросов "в кредит"
			# nodelay: Немедленная обработка без задержек
			limit_req zone=rate_limit burst=0 nodelay;
			limit_req_status 429; # Возвращаем HTTP-ошибку 429 при превышении лимита запросов

			proxy_pass http://backend_servers;
		}
	}
}